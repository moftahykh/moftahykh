name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile artwork
        uses: actions/checkout@v4
      - name: Prepare output directory
        run: mkdir -p dist
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23a95f3c&color_dots=%23e7e1d6,%23b5cbd0,%2381a9b8,%235e8395,%232b526b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23d18e68&color_dots=%232a3a46,%23486672,%23678b96,%2390b1b5,%23c0d2cf
      - name: Compose seamless profile artwork
        run: python3 .github/scripts/build_profile.py
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
